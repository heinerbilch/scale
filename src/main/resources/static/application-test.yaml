# H2 Database Configuration for Integration Tests
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: tiger

  # H2 Console (Optional)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA/Hibernate
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update