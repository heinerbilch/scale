<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mein Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        .create-post-btn {
            margin-bottom: 1.5rem;
        }
        .post-author {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Mein Blog</h1>
        
        <!-- Login/Logout und Create Post Button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="/" class="btn btn-outline-secondary">← Zurück zur Startseite</a>
            </div>
            <div class="d-flex gap-2">
                <div th:if="${currentUser != null}" class="user-info">
                    <img th:src="${currentUser.profilePicture}" class="user-avatar-small" alt="Profilbild" th:unless="${currentUser.profilePicture == null}">
                    <span th:text="${currentUser.firstName}">Benutzer</span>
                </div>
                <a th:if="${currentUser == null}" href="/login" class="btn btn-outline-primary">Anmelden</a>
                <a th:if="${currentUser != null}" href="/logout" class="btn btn-outline-danger">Abmelden</a>
                <a th:if="${currentUser != null}" href="/blog/posts/new" class="btn btn-success">Neuen Post erstellen</a>
            </div>
        </div>

        <div th:each="post : ${posts}">
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title" th:text="${post.title}">Post Titel</h5>
                    <p class="card-text" th:text="${post.content}">Post Inhalt</p>
                    <div class="post-author mb-2" th:if="${post.author != null}">
                        <img th:src="${post.author.profilePicture}" class="user-avatar-small" alt="Autor" th:unless="${post.author.profilePicture == null}">
                        <span th:text="${post.author.firstName + ' ' + post.author.lastName}">Autor</span>
                    </div>
                    <a th:href="@{/blog/posts/{id}(id=${post.id})}" class="btn btn-primary">Weiterlesen</a>
                </div>
                <div class="card-footer text-muted">
                    Erstellt am: <span th:text="${#temporals.format(post.createdAt, 'dd.MM.yyyy HH:mm')}">Datum</span>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
