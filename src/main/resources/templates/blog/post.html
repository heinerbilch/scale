<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${post.title}">Post Titel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 th:text="${post.title}">Post Titel</h1>
        <p th:text="${post.content}">Post Inhalt</p>
        <p>Erstellt am: <span th:text="${#temporals.format(post.createdAt, 'dd.MM.yyyy HH:mm')}">Datum</span></p>
        <a href="/blog/posts" class="btn btn-secondary">Zurück zur Übersicht</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
