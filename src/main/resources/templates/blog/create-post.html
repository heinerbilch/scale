<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Neuen Post erstellen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .form-container {
            max-width: 800px;
            margin: 2rem auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="my-4">Neuen Post erstellen</h1>
        
        <div class="user-info" th:if="${currentUser != null}">
            <img th:src="${currentUser.profilePicture}" class="user-avatar" alt="Profilbild" th:unless="${currentUser.profilePicture == null}">
            <span class="fw-bold" th:text="${currentUser.firstName + ' ' + currentUser.lastName}">Benutzername</span>
        </div>
        
        <form th:action="@{/blog/posts}" th:object="${post}" method="post" class="form-container">
            <div class="mb-3">
                <label for="title" class="form-label">Titel</label>
                <input type="text" class="form-control" id="title" th:field="*{title}" required>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">Inhalt</label>
                <textarea class="form-control" id="content" th:field="*{content}" rows="15" required></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Post erstellen</button>
                <a href="/blog/posts" class="btn btn-secondary">Abbrechen</a>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
