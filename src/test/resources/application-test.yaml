spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: tiger
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false


logging:
  level:
    '[eu.bilch.scale]': debug
    '[org.hibernate]': debug
    '[org.springframework.data]': debug