# Gradle Properties
# Konfiguration des JDK für Gradle
# org.gradle.java.home=/pfad/zum/jdk-21

# Optional: Falls Gradle das JDK nicht automatisch findet, kann der Pfad hier gesetzt werden.
# Beispiel für Linux/Mac:
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home

# Beispiel für Windows:
# org.gradle.java.home=C:\Program Files\Java\jdk-21